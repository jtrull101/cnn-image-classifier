# .github/workflows/ci.yml
# GitHub Actions CI/CD Pipeline for alz-mri-cnn
#
# This workflow handles a UV-managed Python monorepo with:
# - 6 packages under packages/* (config, data, models, training, utils, cli)
# - 1 app under apps/* (api)
#
# Smoke tests run on every push/PR for fast feedback
# Full test suite runs on manual trigger or schedule

name: CI

concurrency:
  group: ${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:
  schedule:
    # Runs every day at 8 AM UTC
    - cron: '0 8 * * *'

jobs:
  smoke-test:
    name: Smoke Tests - Python ${{ matrix.python-version }}
    # Run smoke tests only on push/PR (not on schedule)
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
    - name: Checkout code
      uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

    - name: Install uv
      uses: astral-sh/setup-uv@caf0cab7a618c569241d31dcd442f54681755d39 # v3
      with:
        version: "latest"

    - name: Set up Python ${{ matrix.python-version }}
      run: uv python install ${{ matrix.python-version }}

    - name: Cache UV dependencies
      uses: actions/cache@v4
      with:
        path: |
          .venv
          ~/.cache/uv
        key: uv-${{ runner.os }}-py${{ matrix.python-version }}-${{ hashFiles('uv.lock') }}
        restore-keys: |
          uv-${{ runner.os }}-py${{ matrix.python-version }}-

    - name: Install dependencies
      run: uv sync --all-groups

    - name: Check formatting
      run: uv run ruff format --check .

    - name: Lint with ruff
      run: uv run ruff check .

    - name: Type check with pyright
      run: uv run pyright

    - name: Run smoke tests
      run: uv run python -m pytest -c pyproject.toml --rootdir . -v -m smoke --maxfail=3

    - name: Upload test results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: test-results-py${{ matrix.python-version }}
        path: |
          .pytest_cache/
          htmlcov/
        retention-days: 7

  build:
    name: Build All Packages
    runs-on: ubuntu-latest
    needs: smoke-test
    # Build only on push/PR (not on schedule)
    if: github.event_name == 'push' || github.event_name == 'pull_request'

    steps:
    - name: Checkout code
      uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

    - name: Install uv
      uses: astral-sh/setup-uv@caf0cab7a618c569241d31dcd442f54681755d39 # v3

    - name: Set up Python
      run: uv python install 3.13

    - name: Cache UV dependencies
      uses: actions/cache@v4
      with:
        path: |
          .venv
          ~/.cache/uv
        key: uv-${{ runner.os }}-py3.13-${{ hashFiles('uv.lock') }}
        restore-keys: |
          uv-${{ runner.os }}-py3.13-

    - name: Install dependencies
      run: uv sync --all-groups

    - name: Build all packages
      run: |
        uv build --package img-classifier-config
        uv build --package img-classifier-utils
        uv build --package img-classifier-data
        uv build --package img-classifier-models
        uv build --package img-classifier-training
        uv build --package img-classifier-cli
        uv build --package img-classifier-api

    - name: Upload build artifacts
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
      with:
        name: dist
        path: |
          packages/*/dist/
          apps/*/dist/

  docker-check:
    name: Docker Build & Startup Check
    runs-on: ubuntu-latest
    needs: smoke-test
    if: github.event_name == 'push' || github.event_name == 'pull_request'

    steps:
    - name: Checkout code
      uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Build Docker image
      uses: docker/build-push-action@v6
      with:
        context: .
        file: apps/api/Dockerfile
        tags: cnn-image-classifier:ci
        load: true
        cache-from: type=gha
        cache-to: type=gha,mode=max

    - name: Start container
      run: docker run -d --name api-ci -p 8000:8000 cnn-image-classifier:ci

    - name: Wait for /health
      run: |
        for i in $(seq 1 30); do
          if curl -sf http://localhost:8000/health; then
            echo "Container is healthy"
            exit 0
          fi
          echo "Waiting... ($i/30)"
          sleep 2
        done
        echo "Container did not become healthy within 60s"
        docker logs api-ci
        exit 1

    - name: Stop container
      if: always()
      run: docker rm -f api-ci

  full-test:
    name: Full Test Suite (Manual or Scheduled)
    runs-on: ubuntu-latest
    # Only run on workflow_dispatch or scheduled runs
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'

    steps:
    - name: Checkout code
      uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

    - name: Install uv
      uses: astral-sh/setup-uv@caf0cab7a618c569241d31dcd442f54681755d39 # v3
      with:
        version: "latest"

    - name: Set up Python
      run: uv python install 3.13

    - name: Cache UV dependencies
      uses: actions/cache@v4
      with:
        path: |
          .venv
          ~/.cache/uv
        key: uv-${{ runner.os }}-py3.13-${{ hashFiles('uv.lock') }}
        restore-keys: |
          uv-${{ runner.os }}-py3.13-

    - name: Install dependencies
      run: uv sync --all-groups

    - name: Run full test suite with coverage
      run: uv run pytest -v --maxfail=3 --cov=packages --cov=apps --cov-report=xml --cov-report=term-missing

    - name: Upload full coverage to Codecov
      uses: codecov/codecov-action@b9fd7d16f6d7d1b5d2bec1a2887e65ceed900238 # v4
      with:
        file: ./coverage.xml
        fail_ci_if_error: false
        flags: full-suite
        token: ${{ secrets.CODECOV_TOKEN }}
