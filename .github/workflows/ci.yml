# .github/workflows/ci.yml
# GitHub Actions CI/CD Pipeline for alz-mri-cnn
#
# This workflow handles a UV-managed Python monorepo with:
# - 6 packages under packages/* (config, data, models, training, utils, cli)
# - 1 app under apps/* (api)
#
# Smoke tests run on every push/PR for fast feedback
# Full test suite runs on manual trigger or schedule

name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:
  schedule:
    # Runs every 2 days at 8 AM UTC
    - cron: '0 8 */2 * *'

jobs:
  smoke-test:
    name: Smoke Tests - Python ${{ matrix.python-version }}
    # Run smoke tests only on push/PR (not on schedule)
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.13"]

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install uv
      uses: astral-sh/setup-uv@v3
      with:
        version: "latest"

    - name: Set up Python ${{ matrix.python-version }}
      run: uv python install ${{ matrix.python-version }}

    - name: Install dependencies
      run: uv sync --all-groups

    - name: Check formatting
      run: uv run ruff format --check .

    - name: Lint with ruff
      run: uv run ruff check .

    - name: Type check with pyright
      run: uv run pyright

    - name: Run smoke tests
      run: uv run python -m pytest -c pyproject.toml --rootdir . -v -m smoke --maxfail=3

  build:
    name: Build All Packages
    runs-on: ubuntu-latest
    needs: smoke-test
    # Build only on push/PR (not on schedule)
    if: github.event_name == 'push' || github.event_name == 'pull_request'

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install uv
      uses: astral-sh/setup-uv@v3

    - name: Set up Python
      run: uv python install 3.13

    - name: Install dependencies
      run: uv sync --all-groups

    - name: Build all packages
      run: |
        uv build --package img-classifier-config
        uv build --package img-classifier-utils
        uv build --package img-classifier-data
        uv build --package img-classifier-models
        uv build --package img-classifier-training
        uv build --package img-classifier-cli
        uv build --package img-classifier-api

    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: dist
        path: |
          packages/*/dist/
          apps/*/dist/

  full-test:
    name: Full Test Suite (Manual or Scheduled)
    runs-on: ubuntu-latest
    # Only run on workflow_dispatch or scheduled runs
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install uv
      uses: astral-sh/setup-uv@v3
      with:
        version: "latest"

    - name: Set up Python
      run: uv python install 3.13

    - name: Install dependencies
      run: uv sync --all-groups

    - name: Run full test suite with coverage
      run: uv run pytest -v -n auto --maxfail=3 --cov=packages --cov=apps --cov-report=xml --cov-report=term-missing

    - name: Upload full coverage to Codecov
      uses: codecov/codecov-action@v4
      with:
        file: ./coverage.xml
        fail_ci_if_error: false
        flags: full-suite
        token: ${{ secrets.CODECOV_TOKEN }}
