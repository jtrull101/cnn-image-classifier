<!DOCTYPE html>
<html lang="en" data-theme="business">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Image Classification System - Neural Network powered MRI classification">
    <title>{% block title %}Image Classification System{% endblock %}</title>
    
    <!-- Tailwind CSS (CDN play mode — dynamically generated, SRI not applicable).
         For production, replace with a self-hosted PostCSS build and then add SRI. -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ["Inter", "ui-sans-serif", "system-ui"],
                    },
                    colors: {
                        primary: {
                            50: '#eff6ff',
                            100: '#dbeafe',
                            200: '#bfdbfe',
                            300: '#93c5fd',
                            400: '#60a5fa',
                            500: '#3b82f6',
                            600: '#2563eb',
                            700: '#1d4ed8',
                            800: '#1e40af',
                            900: '#1e3a8a',
                        }
                    }
                }
            }
        }
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- HTMX
         To add SRI: compute sha384 of https://unpkg.com/htmx.org@1.9.10 and set integrity="sha384-<hash>"
         Example: openssl dgst -sha384 -binary htmx.js | openssl base64 -A -->
    <script src="https://unpkg.com/htmx.org@1.9.10"
            crossorigin="anonymous"></script>

    <!-- Alpine.js
         To add SRI: compute sha384 of the cdn.min.js file (see https://www.srihash.org) -->
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.13.5/dist/cdn.min.js"
            crossorigin="anonymous"></script>

    <!-- Chart.js
         To add SRI: compute sha384 of the chart.umd.min.js file (see https://www.srihash.org) -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"
            crossorigin="anonymous"></script>
    
    <!-- DaisyUI component library (works alongside Tailwind CDN play mode) -->
    <link href="https://cdn.jsdelivr.net/npm/daisyui@4/dist/full.css" rel="stylesheet">

    <!-- Custom Styles -->
    <link rel="stylesheet" href="/static/css/styles.css">
    
    {% block extra_head %}{% endblock %}
</head>
<body class="bg-base-200 font-sans min-h-screen" x-data="{}" @ws-status.window="$store.app.wsConnected = $event.detail.connected">
    <!-- Navigation -->
    {% include 'components/navbar.html' %}
    
    <!-- Main Content -->
    <main class="container mx-auto px-4 py-8">
        {% block content %}{% endblock %}
    </main>
    
    <!-- Toast Notifications Container -->
    <div id="toast-container" 
         x-data="toastManager()" 
         class="fixed top-4 right-4 z-50 space-y-2"
         @toast.window="addToast($event.detail)">
        <template x-for="toast in toasts" :key="toast.id">
            <div x-show="toast.show"
                 x-transition:enter="transition ease-out duration-300"
                 x-transition:enter-start="opacity-0 transform translate-x-8"
                 x-transition:enter-end="opacity-100 transform translate-x-0"
                 x-transition:leave="transition ease-in duration-200"
                 x-transition:leave-start="opacity-100"
                 x-transition:leave-end="opacity-0"
                 class="max-w-sm w-full shadow-lg rounded-lg pointer-events-auto bg-base-100 border-l-4"
                 :class="{
                     'border-success': toast.type === 'success',
                     'border-error': toast.type === 'error',
                     'border-info': toast.type === 'info',
                     'border-warning': toast.type === 'warning'
                 }">
                <div class="p-4">
                    <div class="flex items-start">
                        <div class="flex-1">
                            <p class="text-sm font-medium" 
                               :class="{
                                   'text-success': toast.type === 'success',
                                   'text-error': toast.type === 'error',
                                   'text-info': toast.type === 'info',
                                   'text-warning': toast.type === 'warning'
                               }"
                               x-text="toast.message"></p>
                        </div>
                        <button @click="removeToast(toast.id)" class="ml-4 text-base-content/40 hover:text-base-content">
                            <span class="sr-only">Close</span>
                            <svg class="h-5 w-5" fill="currentColor" viewBox="0 0 20 20">
                                <path fill-rule="evenodd" d="M4.293 4.293a1 1 0 011.414 0L10 8.586l4.293-4.293a1 1 0 111.414 1.414L11.414 10l4.293 4.293a1 1 0 01-1.414 1.414L10 11.414l-4.293 4.293a1 1 0 01-1.414-1.414L8.586 10 4.293 5.707a1 1 0 010-1.414z" clip-rule="evenodd"/>
                            </svg>
                        </button>
                    </div>
                </div>
            </div>
        </template>
    </div>
    
    <!-- Loading Overlay -->
    <div x-show="$store.app.loading"
         x-cloak
         role="status"
         aria-live="polite"
         aria-label="Loading"
         class="fixed inset-0 bg-gray-900 bg-opacity-50 flex items-center justify-center z-40">
        <div class="bg-base-100 rounded-lg p-8 flex flex-col items-center">
            <div class="animate-spin rounded-full h-16 w-16 border-b-4 border-primary"></div>
            <p class="mt-4 text-base-content font-medium" x-text="$store.app.loadingMessage"></p>
        </div>
    </div>
    
    <!-- Custom Scripts -->
    <script src="/static/js/utils.js"></script>
    <script src="/static/js/websocket.js"></script>
    <script src="/static/js/components.js"></script>
    <script src="/static/js/app.js"></script>
    
    <script>
        // Alpine.js Toast Manager Component
        function toastManager() {
            return {
                toasts: [],
                nextId: 1,
                addToast(data) {
                    const id = this.nextId++;
                    const toast = {
                        id: id,
                        message: data.message || 'Notification',
                        type: data.type || 'info',
                        show: true
                    };
                    this.toasts.push(toast);

                    // Auto-remove after 5 seconds
                    setTimeout(() => this.removeToast(id), data.duration || 5000);
                },
                removeToast(id) {
                    const index = this.toasts.findIndex(t => t.id === id);
                    if (index > -1) {
                        this.toasts[index].show = false;
                        setTimeout(() => {
                            this.toasts.splice(index, 1);
                        }, 300);
                    }
                }
            }
        }

        // Helper function to show toast notifications (used by websocket.js and app.js)
        window.showToast = function(message, type = 'info', duration = 5000) {
            window.dispatchEvent(new CustomEvent('toast', {
                detail: { message, type, duration }
            }));
        };
    </script>
    
    {% block extra_scripts %}{% endblock %}
</body>
</html>
