{% extends "base.html" %}

{% block title %}Compare Models - Image Classification System{% endblock %}

{% block content %}
<div class="container mx-auto px-4 py-8" x-data="comparePage()">

    <!-- Page Header -->
    <div class="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-4 mb-8">
        <div>
            <h1 class="text-4xl font-bold text-base-content mb-2">Compare Models</h1>
            <p class="text-base-content/60">Upload an image and see predictions from multiple models side by side</p>
        </div>
    </div>

    <!-- No models warning -->
    <template x-if="availableModels.length < 2">
        <div role="alert" class="alert alert-warning mb-8 flex items-start gap-3">
            <svg class="w-5 h-5 flex-shrink-0 mt-0.5" aria-hidden="true" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                      d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"/>
            </svg>
            <div>
                <p class="text-sm font-medium">Not enough models loaded</p>
                <p class="text-sm mt-0.5">
                    Load at least 2 models on the
                    <a href="/models-ui" class="underline font-medium">Models page</a>
                    to run a comparison.
                    <span x-show="availableModels.length === 1">
                        You currently have <strong x-text="availableModels.length"></strong> model loaded.
                    </span>
                    <span x-show="availableModels.length === 0">No models are loaded.</span>
                </p>
            </div>
        </div>
    </template>

    <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">

        <!-- Left column: upload + model selection -->
        <div class="space-y-6">

            <!-- Image Upload Card -->
            <div class="card">
                <div class="card-header">
                    <h2 class="card-title">Upload Image</h2>
                </div>
                <div class="card-body">
                    <div
                        class="upload-zone"
                        :class="{ 'border-primary': isDragging }"
                        @click="$refs.fileInput.click()"
                        @dragover.prevent="isDragging = true"
                        @dragleave.prevent="isDragging = false"
                        @drop.prevent="handleDrop($event)"
                    >
                        <input
                            type="file"
                            x-ref="fileInput"
                            accept="image/*"
                            class="hidden"
                            @change="handleFileSelect($event)"
                        >
                        <template x-if="!previewUrl">
                            <div class="text-center">
                                <svg class="w-12 h-12 mx-auto mb-3 text-base-content/30" aria-hidden="true" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"/>
                                </svg>
                                <p class="text-sm font-semibold text-base-content">Click or drag & drop</p>
                                <p class="text-xs text-base-content/50 mt-1">PNG, JPG up to 10 MB</p>
                            </div>
                        </template>
                        <template x-if="previewUrl">
                            <div class="space-y-3">
                                <img :src="previewUrl" class="max-h-48 mx-auto rounded-lg shadow" alt="Preview">
                                <p class="text-xs text-center text-base-content/60 truncate" x-text="selectedFile?.name"></p>
                                <button
                                    type="button"
                                    class="btn btn-secondary btn-sm w-full"
                                    @click.stop="clearFile()"
                                >
                                    Clear
                                </button>
                            </div>
                        </template>
                    </div>
                </div>
            </div>

            <!-- Model Selection Card -->
            <div class="card">
                <div class="card-header">
                    <h2 class="card-title">Models to Compare</h2>
                    <span class="badge badge-info"
                          x-text="`${selectedModels.length} selected`"></span>
                </div>
                <div class="card-body space-y-2">
                    <template x-if="availableModels.length === 0">
                        <p class="text-sm text-base-content/60 italic">No models loaded.</p>
                    </template>
                    <template x-for="m in availableModels" :key="m.name">
                        <label class="flex items-center gap-3 p-2 rounded-lg hover:bg-base-200 cursor-pointer">
                            <input
                                type="checkbox"
                                class="rounded"
                                :value="m.name"
                                x-model="selectedModels"
                            >
                            <div class="min-w-0">
                                <p class="text-sm font-medium text-base-content truncate" x-text="m.name"></p>
                                <p class="text-xs text-base-content/60"
                                   x-text="`${m.num_classes} classes${m.accuracy ? ' · ' + (m.accuracy * 100).toFixed(1) + '% acc' : ''}`"></p>
                            </div>
                        </label>
                    </template>

                    <div class="flex gap-2 pt-2 border-t border-base-300">
                        <button class="btn btn-secondary btn-sm flex-1"
                                @click="selectedModels = availableModels.map(m => m.name)">
                            All
                        </button>
                        <button class="btn btn-secondary btn-sm flex-1"
                                @click="selectedModels = []">
                            None
                        </button>
                    </div>

                    <button
                        class="btn btn-primary w-full mt-2"
                        :disabled="!selectedFile || selectedModels.length === 0 || comparing"
                        @click="runComparison()"
                    >
                        <span x-show="!comparing">Compare</span>
                        <span x-show="comparing" class="flex items-center justify-center gap-2">
                            <span class="spinner-sm"></span>
                            Comparing…
                        </span>
                    </button>
                </div>
            </div>
        </div>

        <!-- Right 2/3: results -->
        <div class="lg:col-span-2">

            <!-- Empty state (no results yet) -->
            <template x-if="!hasResults && !comparing">
                <div class="flex flex-col items-center justify-center py-20 px-4 text-center">
                    <div class="bg-base-200 rounded-full p-6 mb-6">
                        <svg class="w-12 h-12 text-base-content/40" aria-hidden="true" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"
                                  d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z"/>
                        </svg>
                    </div>
                    <h3 class="text-lg font-semibold text-base-content mb-2">No comparison yet</h3>
                    <p class="text-base-content/60 text-sm max-w-sm">
                        Upload an image, select at least two models, and click Compare.
                    </p>
                </div>
            </template>

            <!-- Loading state -->
            <template x-if="comparing">
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                    <template x-for="i in selectedModels" :key="i">
                        <div class="card">
                            <div class="card-body">
                                <div class="skeleton-loader space-y-3">
                                    <div class="skeleton-line w-1/2"></div>
                                    <div class="skeleton-line w-3/4"></div>
                                    <div class="skeleton-line w-full"></div>
                                    <div class="skeleton-line w-2/3"></div>
                                </div>
                            </div>
                        </div>
                    </template>
                </div>
            </template>

            <!-- Error -->
            <template x-if="error && !comparing">
                <div role="alert" class="alert alert-error flex items-start gap-3">
                    <svg class="w-5 h-5 flex-shrink-0 mt-0.5" aria-hidden="true" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                              d="M10 14l2-2m0 0l2-2m-2 2l-2-2m2 2l2 2m7-2a9 9 0 11-18 0 9 9 0 0118 0z"/>
                    </svg>
                    <p class="text-sm" x-text="error"></p>
                </div>
            </template>

            <!-- Results grid -->
            <template x-if="hasResults && !comparing">
                <div class="space-y-6">
                    <!-- Winner banner -->
                    <div class="bg-warning rounded-xl p-4 text-warning-content flex items-center gap-4 shadow-lg">
                        <svg class="w-8 h-8 shrink-0" aria-hidden="true" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4M7.835 4.697a3.42 3.42 0 001.946-.806 3.42 3.42 0 014.438 0 3.42 3.42 0 001.946.806 3.42 3.42 0 013.138 3.138 3.42 3.42 0 00.806 1.946 3.42 3.42 0 010 4.438 3.42 3.42 0 00-.806 1.946 3.42 3.42 0 01-3.138 3.138 3.42 3.42 0 00-1.946.806 3.42 3.42 0 01-4.438 0 3.42 3.42 0 00-1.946-.806 3.42 3.42 0 01-3.138-3.138 3.42 3.42 0 00-.806-1.946 3.42 3.42 0 010-4.438 3.42 3.42 0 00.806-1.946 3.42 3.42 0 013.138-3.138z"/>
                        </svg>
                        <div>
                            <p class="text-sm font-medium opacity-90">Most confident prediction</p>
                            <p class="font-bold text-lg" x-text="`${winner.model} → ${winner.class}`"></p>
                            <p class="text-sm opacity-90" x-text="`${(winner.confidence * 100).toFixed(1)}% confidence`"></p>
                        </div>
                    </div>

                    <!-- Per-model cards -->
                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                        <template x-for="(pred, modelName) in results.predictions" :key="modelName">
                            <div class="card"
                                 :class="{ 'ring-2 ring-warning': modelName === winner.model }">
                                <div class="card-header">
                                    <h3 class="font-bold text-base-content truncate" x-text="modelName"></h3>
                                    <span x-show="modelName === winner.model"
                                          class="badge badge-warning text-xs">Best</span>
                                    <span x-show="pred.class_name === 'ERROR'"
                                          class="badge badge-error text-xs">Error</span>
                                </div>
                                <div class="card-body space-y-4">
                                    <!-- Predicted class -->
                                    <div class="bg-base-200 rounded-lg p-3 text-center">
                                        <p class="text-xs text-base-content/60 mb-1">Predicted class</p>
                                        <p class="text-xl font-bold text-base-content" x-text="pred.class_name"></p>
                                        <p class="text-sm text-base-content/70 mt-1"
                                           x-text="`${(pred.confidence * 100).toFixed(1)}% confidence`"></p>
                                        <!-- Confidence bar -->
                                        <div class="w-full bg-base-300 rounded-full h-2 mt-2">
                                            <div class="h-2 rounded-full transition-all duration-700"
                                                 :style="`width: ${pred.confidence * 100}%`"
                                                 :class="pred.confidence >= 0.8 ? 'bg-success' : pred.confidence >= 0.5 ? 'bg-warning' : 'bg-error'">
                                            </div>
                                        </div>
                                    </div>

                                    <!-- Top-3 probabilities -->
                                    <div x-show="Object.keys(pred.probabilities || {}).length > 0">
                                        <p class="text-xs font-medium text-base-content/50 uppercase tracking-wide mb-2">Top classes</p>
                                        <div class="space-y-1.5">
                                            <template x-for="[cls, prob] in top3(pred.probabilities)" :key="cls">
                                                <div class="flex items-center gap-2">
                                                    <span class="text-xs text-base-content w-28 truncate" x-text="cls"></span>
                                                    <div class="flex-1 bg-base-300 rounded-full h-1.5">
                                                        <div class="h-1.5 bg-primary rounded-full"
                                                             :style="`width: ${prob * 100}%`"></div>
                                                    </div>
                                                    <span class="text-xs font-medium text-base-content/70 w-10 text-right"
                                                          x-text="`${(prob * 100).toFixed(1)}%`"></span>
                                                </div>
                                            </template>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </template>
                    </div>

                    <!-- Comparison table -->
                    <div class="card">
                        <div class="card-header">
                            <h2 class="card-title">Side-by-Side Summary</h2>
                        </div>
                        <div class="card-body overflow-x-auto">
                            <table class="w-full text-sm">
                                <thead>
                                    <tr class="border-b border-base-300">
                                        <th class="text-left py-2 pr-4 font-medium text-base-content/60 w-32">Model</th>
                                        <th class="text-left py-2 pr-4 font-medium text-base-content/60">Prediction</th>
                                        <th class="text-right py-2 font-medium text-base-content/60">Confidence</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    <template x-for="(pred, modelName) in results.predictions" :key="modelName">
                                        <tr class="border-b border-base-200 hover:bg-base-200"
                                            :class="{ 'bg-warning/10': modelName === winner.model }">
                                            <td class="py-2 pr-4 font-medium text-base-content truncate max-w-[8rem]"
                                                x-text="modelName"></td>
                                            <td class="py-2 pr-4 text-base-content/80" x-text="pred.class_name"></td>
                                            <td class="py-2 text-right font-semibold"
                                                :class="pred.confidence >= 0.8 ? 'text-success' : pred.confidence >= 0.5 ? 'text-warning' : 'text-error'"
                                                x-text="`${(pred.confidence * 100).toFixed(1)}%`"></td>
                                        </tr>
                                    </template>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </template>
        </div>
    </div>
</div>

<script>
function comparePage() {
    return {
        availableModels: [],
        selectedModels: [],
        selectedFile: null,
        previewUrl: null,
        isDragging: false,
        comparing: false,
        error: null,
        results: null,

        get hasResults() {
            return this.results !== null;
        },

        get winner() {
            if (!this.results) return { model: "", class: "", confidence: 0 };
            let best = { model: "", class: "", confidence: -1 };
            for (const [modelName, pred] of Object.entries(this.results.predictions)) {
                if (pred.confidence > best.confidence && pred.class_name !== "ERROR") {
                    best = { model: modelName, class: pred.class_name, confidence: pred.confidence };
                }
            }
            return best;
        },

        async init() {
            await this.loadModels();
        },

        async loadModels() {
            try {
                const data = await window.utils.api.get("/api/models");
                this.availableModels = data.models || [];
                this.selectedModels = this.availableModels.map(m => m.name);
            } catch (e) {
                console.error("Failed to load models", e);
            }
        },

        handleFileSelect(event) {
            const file = event.target.files[0];
            if (file) this.setFile(file);
        },

        handleDrop(event) {
            this.isDragging = false;
            const file = event.dataTransfer.files[0];
            if (file && file.type.startsWith("image/")) this.setFile(file);
        },

        setFile(file) {
            this.selectedFile = file;
            this.previewUrl = URL.createObjectURL(file);
            this.results = null;
            this.error = null;
        },

        clearFile() {
            this.selectedFile = null;
            if (this.previewUrl) URL.revokeObjectURL(this.previewUrl);
            this.previewUrl = null;
            this.results = null;
            this.error = null;
        },

        top3(probabilities) {
            if (!probabilities) return [];
            return Object.entries(probabilities)
                .sort(([, a], [, b]) => b - a)
                .slice(0, 3);
        },

        async runComparison() {
            if (!this.selectedFile || this.selectedModels.length === 0 || this.comparing) return;
            this.comparing = true;
            this.error = null;
            this.results = null;

            try {
                const formData = new FormData();
                formData.append("file", this.selectedFile);

                const params = this.selectedModels.map(m => `model_names=${encodeURIComponent(m)}`).join("&");
                const url = `/api/predict/compare?${params}`;

                const resp = await fetch(url, { method: "POST", body: formData });
                if (!resp.ok) {
                    const err = await resp.json().catch(() => ({}));
                    throw new Error(err.detail || `HTTP ${resp.status}`);
                }
                this.results = await resp.json();
            } catch (e) {
                this.error = e.message || "Comparison failed";
            } finally {
                this.comparing = false;
            }
        },
    };
}
</script>
{% endblock %}
