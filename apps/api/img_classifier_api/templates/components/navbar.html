<nav class="bg-base-100 shadow-sm border-b border-base-200" x-data="{ mobileMenuOpen: false }">
    <div class="container mx-auto px-4">
        <div class="flex justify-between items-center py-4">
            <!-- Logo/Brand -->
            <div class="flex items-center space-x-4">
                <a href="/" class="flex items-center space-x-2">
                    <svg class="w-8 h-8 text-primary" aria-label="Image Classifier logo" role="img" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/>
                    </svg>
                    <span class="text-xl font-bold text-base-content">Image Classifier</span>
                </a>
            </div>
            
            <!-- Desktop Navigation -->
            <div class="hidden md:flex items-center space-x-1">
                <a href="/" 
                   class="px-4 py-2 rounded-lg text-base-content hover:bg-base-200 hover:text-base-content transition-colors duration-200
                          {% if request.url.path == '/' %}bg-primary/10 text-primary font-medium{% endif %}">
                    Dashboard
                </a>
                <a href="/predict"
                   class="px-4 py-2 rounded-lg text-base-content hover:bg-base-200 hover:text-base-content transition-colors duration-200
                          {% if request.url.path == '/predict' %}bg-primary/10 text-primary font-medium{% endif %}">
                    Predict
                </a>
                <a href="/models-ui"
                   class="px-4 py-2 rounded-lg text-base-content hover:bg-base-200 hover:text-base-content transition-colors duration-200
                          {% if request.url.path == '/models-ui' %}bg-primary/10 text-primary font-medium{% endif %}">
                    Models
                </a>
                <a href="/train"
                   class="px-4 py-2 rounded-lg text-base-content hover:bg-base-200 hover:text-base-content transition-colors duration-200
                          {% if request.url.path == '/train' %}bg-primary/10 text-primary font-medium{% endif %}">
                    Train Model
                </a>
                <a href="/datasets-ui"
                   class="px-4 py-2 rounded-lg text-base-content hover:bg-base-200 hover:text-base-content transition-colors duration-200
                          {% if request.url.path == '/datasets-ui' %}bg-primary/10 text-primary font-medium{% endif %}">
                    Datasets
                </a>
                <a href="/compare"
                   class="px-4 py-2 rounded-lg text-base-content hover:bg-base-200 hover:text-base-content transition-colors duration-200
                          {% if request.url.path == '/compare' %}bg-primary/10 text-primary font-medium{% endif %}">
                    Compare
                </a>
                <a href="/batch" 
                   class="px-4 py-2 rounded-lg text-base-content hover:bg-base-200 hover:text-base-content transition-colors duration-200
                          {% if request.url.path == '/batch' %}bg-primary/10 text-primary font-medium{% endif %}">
                    Batch
                </a>
                <a href="/history" 
                   class="px-4 py-2 rounded-lg text-base-content hover:bg-base-200 hover:text-base-content transition-colors duration-200
                          {% if request.url.path == '/history' %}bg-primary/10 text-primary font-medium{% endif %}">
                    History
                </a>
                <a href="/analytics" 
                   class="px-4 py-2 rounded-lg text-base-content hover:bg-base-200 hover:text-base-content transition-colors duration-200
                          {% if request.url.path == '/analytics' %}bg-primary/10 text-primary font-medium{% endif %}">
                    Analytics
                </a>
            </div>
            
            <!-- Status Indicators & Mobile Menu Button -->
            <div class="flex items-center space-x-4">
                <!-- Active Model Display -->
                <div class="hidden lg:flex items-center space-x-2 px-3 py-1.5 bg-base-200 rounded-lg">
                    <svg class="w-4 h-4 text-base-content" aria-hidden="true" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 3v2m6-2v2M9 19v2m6-2v2M5 9H3m2 6H3m18-6h-2m2 6h-2M7 19h10a2 2 0 002-2V7a2 2 0 00-2-2H7a2 2 0 00-2 2v10a2 2 0 002 2zM9 9h6v6H9V9z"/>
                    </svg>
                    <span class="text-sm text-base-content" x-text="$store.app.activeModel || 'No model'"></span>
                </div>
                
                <!-- WebSocket Status -->
                <div class="flex items-center space-x-2 px-3 py-1.5 bg-base-200 rounded-lg">
                    <div class="relative">
                        <div class="w-3 h-3 rounded-full transition-colors duration-300"
                             :class="$store.app.wsConnected ? 'bg-green-500' : 'bg-red-500'">
                        </div>
                        <div class="absolute inset-0 w-3 h-3 rounded-full animate-ping"
                             :class="$store.app.wsConnected ? 'bg-green-400' : 'bg-red-400'"
                             x-show="$store.app.wsConnected"></div>
                    </div>
                    <span class="text-xs text-base-content hidden sm:inline" x-text="$store.app.wsConnected ? 'Connected' : 'Disconnected'"></span>
                </div>
                
                <!-- Mobile Menu Button -->
                <button @click="mobileMenuOpen = !mobileMenuOpen"
                        :aria-expanded="mobileMenuOpen.toString()"
                        aria-controls="mobile-menu"
                        aria-label="Toggle navigation menu"
                        class="md:hidden p-2 rounded-lg text-base-content hover:bg-base-200 focus:outline-none focus:ring-2 focus:ring-primary">
                    <svg class="w-6 h-6" aria-hidden="true" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path x-show="!mobileMenuOpen" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"/>
                        <path x-show="mobileMenuOpen" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/>
                    </svg>
                </button>
            </div>
        </div>
        
        <!-- Mobile Menu -->
        <div id="mobile-menu" x-show="mobileMenuOpen"
             x-transition:enter="transition ease-out duration-200"
             x-transition:enter-start="opacity-0 transform -translate-y-2"
             x-transition:enter-end="opacity-100 transform translate-y-0"
             x-transition:leave="transition ease-in duration-150"
             x-transition:leave-start="opacity-100 transform translate-y-0"
             x-transition:leave-end="opacity-0 transform -translate-y-2"
             class="md:hidden pb-4 border-t border-base-200 mt-2">
            <div class="flex flex-col space-y-2 mt-4">
                <a href="/" 
                   class="px-4 py-2 rounded-lg text-base-content hover:bg-base-200 hover:text-base-content
                          {% if request.url.path == '/' %}bg-primary/10 text-primary font-medium{% endif %}">
                    Dashboard
                </a>
                <a href="/predict"
                   class="px-4 py-2 rounded-lg text-base-content hover:bg-base-200 hover:text-base-content
                          {% if request.url.path == '/predict' %}bg-primary/10 text-primary font-medium{% endif %}">
                    Predict
                </a>
                <a href="/models-ui"
                   class="px-4 py-2 rounded-lg text-base-content hover:bg-base-200 hover:text-base-content
                          {% if request.url.path == '/models-ui' %}bg-primary/10 text-primary font-medium{% endif %}">
                    Models
                </a>
                <a href="/train"
                   class="px-4 py-2 rounded-lg text-base-content hover:bg-base-200 hover:text-base-content
                          {% if request.url.path == '/train' %}bg-primary/10 text-primary font-medium{% endif %}">
                    Train Model
                </a>
                <a href="/datasets-ui"
                   class="px-4 py-2 rounded-lg text-base-content hover:bg-base-200 hover:text-base-content
                          {% if request.url.path == '/datasets-ui' %}bg-primary/10 text-primary font-medium{% endif %}">
                    Datasets
                </a>
                <a href="/compare"
                   class="px-4 py-2 rounded-lg text-base-content hover:bg-base-200 hover:text-base-content
                          {% if request.url.path == '/compare' %}bg-primary/10 text-primary font-medium{% endif %}">
                    Compare Models
                </a>
                <a href="/batch" 
                   class="px-4 py-2 rounded-lg text-base-content hover:bg-base-200 hover:text-base-content
                          {% if request.url.path == '/batch' %}bg-primary/10 text-primary font-medium{% endif %}">
                    Batch Processing
                </a>
                <a href="/history" 
                   class="px-4 py-2 rounded-lg text-base-content hover:bg-base-200 hover:text-base-content
                          {% if request.url.path == '/history' %}bg-primary/10 text-primary font-medium{% endif %}">
                    History
                </a>
                <a href="/analytics" 
                   class="px-4 py-2 rounded-lg text-base-content hover:bg-base-200 hover:text-base-content
                          {% if request.url.path == '/analytics' %}bg-primary/10 text-primary font-medium{% endif %}">
                    Analytics
                </a>
                
                <!-- Mobile Active Model Display -->
                <div class="px-4 py-2 bg-base-200 rounded-lg mt-4">
                    <div class="flex items-center space-x-2">
                        <svg class="w-4 h-4 text-base-content" aria-hidden="true" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 3v2m6-2v2M9 19v2m6-2v2M5 9H3m2 6H3m18-6h-2m2 6h-2M7 19h10a2 2 0 002-2V7a2 2 0 00-2-2H7a2 2 0 00-2 2v10a2 2 0 002 2zM9 9h6v6H9V9z"/>
                        </svg>
                        <div>
                            <p class="text-xs text-base-content/60">Active Model</p>
                            <p class="text-sm font-medium text-base-content" x-text="$store.app.activeModel || 'No model'"></p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</nav>
