[project]
name = "img-classifier-api"
  version = "0.2.0"
description = "FastAPI for generic image classification CNN predictions"
authors = [{ name = "Jonathan Trull" }]
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = { text = "MIT" }

dependencies = [
    "img-classifier-config",
    "img-classifier-data",
    "img-classifier-models",
    "img-classifier-training",
    "img-classifier-utils",
    "fastapi>=0.104.0",
    "uvicorn[standard]>=0.24.0",
    "python-multipart>=0.0.6",
    "jinja2>=3.1.2",
    "aiofiles>=23.2.1",
    "tensorflow>=2.13.0",
    "keras>=2.13.0",
    "numpy>=1.24.0",
    "opencv-python>=4.8.0",
    "pillow>=10.0.0",
    "pydantic>=2.5.0",
]

[tool.uv.sources]
img-classifier-config = { workspace = true }
img-classifier-data = { workspace = true }
img-classifier-models = { workspace = true }
img-classifier-utils = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["img_classifier_api"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.pyright]
typeCheckingMode = "basic"
pythonVersion = "3.13"
