[project]
name = "alz-mri-api"
version = "0.1.0"
description = "Flask API for Alzheimer's MRI CNN predictions"
authors = [{ name = "Jonathan Trull" }]
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = { text = "MIT" }

dependencies = [
    "alz-mri-config",
    "alz-mri-data",
    "alz-mri-models",
    "alz-mri-utils",
    "flask>=3.0.0",
    "werkzeug>=3.0.0",
    "tensorflow>=2.13.0",
    "keras>=2.13.0",
    "numpy>=1.24.0",
    "opencv-python>=4.8.0",
    "pillow>=10.0.0",
]

[tool.uv.sources]
alz-mri-config = { workspace = true }
alz-mri-data = { workspace = true }
alz-mri-models = { workspace = true }
alz-mri-utils = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["alz_mri_api"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.pyright]
typeCheckingMode = "basic"
pythonVersion = "3.13"
