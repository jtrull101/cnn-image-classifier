[project]
name = "img-classifier-cli"
version = "0.1.0"
description = "Command-line interface for image classification system"
authors = [{ name = "Jonathan Trull" }]
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = { text = "MIT" }

dependencies = [
    "img-classifier-config",
    "img-classifier-data",
    "img-classifier-models",
    "img-classifier-training",
    "img-classifier-utils",
    "click>=8.0.0",
]

[project.scripts]
img-classifier = "img_classifier_cli.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["img_classifier_cli"]

[tool.uv.sources]
img-classifier-config = { workspace = true }
img-classifier-data = { workspace = true }
img-classifier-models = { workspace = true }
img-classifier-training = { workspace = true }
img-classifier-utils = { workspace = true }

[tool.ty.environment]
python-version = "3.13"

