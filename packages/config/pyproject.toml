[project]
name = "img-classifier-config"
version = "0.2.0"
description = "Configuration management for image classification systems"
authors = [{ name = "Jonathan Trull" }]
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = { text = "MIT" }

dependencies = [
    "pyyaml>=6.0",
    "pydantic-settings>=2.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["img_classifier_config"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ty.environment]
python-version = "3.13"
