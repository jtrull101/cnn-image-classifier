[project]
name = "alz-mri-data"
version = "0.1.0"
description = "Data loading and preprocessing for Alzheimer's MRI CNN"
authors = [{ name = "Jonathan Trull" }]
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = { text = "MIT" }

dependencies = [
    "alz-mri-config",
    "alz-mri-utils",
    "numpy>=1.24.0",
    "opencv-python>=4.8.0",
    "pillow>=10.0.0",
    "scikit-learn>=1.3.0",
    "tqdm>=4.66.1",
]

[tool.uv.sources]
alz-mri-config = { workspace = true }
alz-mri-utils = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["alz_mri_data"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.pyright]
typeCheckingMode = "basic"
pythonVersion = "3.13"
