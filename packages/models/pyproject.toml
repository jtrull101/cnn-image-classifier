[project]
name = "img-classifier-models"
version = "0.1.0"
description = "Neural network models for image classification"
authors = [{ name = "Jonathan Trull" }]
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = { text = "MIT" }

dependencies = [
    "img-classifier-config",
    "tensorflow>=2.20.0",
    "keras>=2.20.0",
    "numpy>=1.24.0",
]

[tool.uv.sources]
img-classifier-config = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["img_classifier_models"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.pyright]
typeCheckingMode = "basic"
pythonVersion = "3.13"
