[project]
name = "img-classifier-utils"
version = "0.1.0"
description = "Utility functions for Alzheimer's MRI CNN"
authors = [{ name = "Jonathan Trull" }]
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = { text = "MIT" }

dependencies = [
    "gdown>=4.7.1",
    "pyunpack>=0.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["img_classifier_utils"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.pyright]
typeCheckingMode = "basic"
pythonVersion = "3.13"
