# Monorepo Workspace Configuration
[project]
name = "alz-mri-neural-network"
version = "0.1.0"
requires-python = ">=3.11,<3.14"
# Workspace packages must be listed here to be installed by UV
# The [tool.uv.sources] section tells UV they come from the workspace
dependencies = [
    "img-classifier-api",
    "img-classifier-config",
    "img-classifier-data",
    "img-classifier-models",
    "img-classifier-training",
    "img-classifier-utils",
    "img-classifier-cli",
    "tensorflow[and-cuda]==2.20.0",
]

[tool.uv.workspace]
members = [
    "apps/api",
    "packages/cli",
    "packages/config",
    "packages/data",
    "packages/models",
    "packages/training",
    "packages/utils",
]

[dependency-groups]
dev = [
    "ruff>=0.15.10",
    "ty>=0.0.44",
    "pydantic>=2.13.0",
    "pydantic-settings>=2.1.0",
    "pip-audit>=2.10.0",
    "codespell>=2.4.2",
    "vulture>=2.16",
]

e2e = [
    "pytest-playwright>=0.4.4",
    "playwright>=1.58.0",
    "pytest-timeout>=2.2.0",
]
optimize = [
    "optuna>=4.0.0",
]

test = [
    "pytest>=9.0.3",
    "pytest-cov>=4.1.0",
    "pytest-mock>=3.15.1",
    "pytest-ordering>=0.6",
    "pytest-xdist>=3.8.0",
    "pytest-timeout>=2.2.0",
    "pytest-asyncio>=0.23.0",
    "testcontainers>=4.14.2",
]

types = [
    "pandas-stubs>=2.0.0",
]

[tool.uv.sources]
img-classifier-api = { workspace = true }
img-classifier-cli = { workspace = true }
img-classifier-config = { workspace = true }
img-classifier-data = { workspace = true }
img-classifier-models = { workspace = true }
img-classifier-training = { workspace = true }
img-classifier-utils = { workspace = true }

# Pytest Configuration
[tool.pytest.ini_options]
minversion = "7.0"
asyncio_mode = "auto"
addopts = [
    "-n=4", # Use 4 parallel workers (adjust based on your CPU cores)
    "--dist=loadgroup",  # Distribute tests by group (respects marks)
    "--strict-markers",  # Enforce marker registration
    "--tb=short",  # Shorter traceback format
    "-v",  # Verbose output
    "--maxfail=3",  # Stop after 3 failures
    "--cov-report=term-missing",
    "--cov-report=html",
    "--cov-report=xml",
    "--timeout=300",  # Global timeout of 5 minutes per test
    "-ra",  # Show extra test summary info
]
testpaths = ["apps", "tests", "packages"]
pythonpath = ["."]
python_files = ["test_*.py", "*_test.py", "tests.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

# Marker definitions (also registered in conftest.py)
norecursedirs = [
    "e2e",
    ".git", ".venv", "__pycache__", "*.egg-info",
]

markers = [
    "unit: Fast unit tests using mocks and no I/O (default)",
    "integration: Slower integration tests using real dependencies and I/O",
    "smoke: Critical path validation tests (run in pre-commit hooks)",
    "slow: Slow tests that take significant time to run",
    "serial: Tests that must run serially, not in parallel",
    "requires_gpu: Tests that require GPU access",
    "requires_data: Tests that require dataset download",
    "e2e: Browser-based end-to-end tests using Playwright (run with make test-e2e)",
]

filterwarnings = [
    # System/infrastructure warnings we cannot control
    "ignore::ResourceWarning",
    "ignore::pytest.PytestUnhandledThreadExceptionWarning",

    # External library compatibility warnings (NOT our code to fix):

    # 1. Keras optimizer loading warning - EXPECTED and BENIGN behavior
    #    When loading saved models, Keras warns that optimizer state differs.
    #    This is intentional - we save models for inference/transfer learning only.
    #    Root cause: Not saving/loading optimizer state (correct for checkpointing).
    #    Action: Suppress - this is proper model serialization practice.
    "ignore:Skipping variable loading for optimizer:UserWarning:keras.src.saving.saving_lib",

    # 2. NumPy 2.0 compatibility in TensorFlow/Keras backend
    #    Warning originates from inside keras/tensorflow, not our code.
    #    Root cause: TensorFlow/Keras not yet fully compatible with NumPy 2.0.
    #    Action: Suppress - waiting for upstream fix.
    #    Tracking: https://github.com/tensorflow/tensorflow/issues/62003
    #    Alternative: Pin numpy<2.0 in dependencies if this becomes critical.
    "ignore:__array__ implementation doesn't accept a copy keyword:DeprecationWarning:keras.src.backend",

    # All other deprecation warnings should be surfaced and fixed in our code
]

log_cli = true
log_cli_level = "INFO"
log_file = "logs/test.log"
log_file_date_format = "%Y-%m-%d %H:%M:%S"
log_file_format = "%(asctime)s - %(name)s %(levelname)s %(message)s"
log_file_level = "INFO"
log_format = "%(asctime)s %(levelname)s %(message)s"
log_level = "DEBUG"

# xdist specific settings
[tool.pytest_xdist]
# Workers will be restarted after each test group
worker_restart_on_failure = true

# Coverage Configuration
[tool.coverage.run]
source = [
    "packages/config/img_classifier_config",
    "packages/utils/img_classifier_utils",
    "packages/data/img_classifier_data",
    "packages/models/img_classifier_models",
    "packages/training/img_classifier_training",
    "apps/api/img_classifier_api",
    "packages/cli/img_classifier_cli",
]
branch = true
parallel = true
relative_files = true
omit = [
    "*/tests/*",
    "*/__pycache__/*",
    "*/deprecated_*",
    "*/alembic/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if __name__ == .__main__.:",
    "raise AssertionError",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
    "@abstractmethod",
]
precision = 2
show_missing = true
skip_covered = false
sort = "Cover"
fail_under = 80

# Ruff Configuration (replaces flake8, isort, autopep8)
[tool.ruff]
target-version = "py313"
line-length = 100
src = ["src", "tests"]
extend-exclude = ["vulture_allowlist.py"]  # Bare names for vulture; not real code

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # pyflakes
    "I",      # isort
    "N",      # pep8-naming
    "UP",     # pyupgrade
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "DTZ",    # flake8-datetimez
    "SIM",    # flake8-simplify
    "ARG",    # flake8-unused-arguments
    "PTH",    # flake8-use-pathlib
    "RUF",    # Ruff-specific rules
    "S",      # flake8-bandit (security)
    "D",      # pydocstyle (docstrings)
    "PT",     # flake8-pytest-style
    "RET",    # flake8-return
    "PERF",   # Perflint
    "LOG",    # flake8-logging
    "G",      # flake8-logging-format
    "ASYNC",  # flake8-async
    "TID",    # flake8-tidy-imports
    "FA",     # flake8-future-annotations
]
ignore = [
    "E501",    # Line length handled by the formatter; long strings/URLs are intentional
    "ARG001",  # Unused function args OK for ML/framework callbacks (see CLAUDE.md)
    "ARG002",  # Unused method args OK for ML/framework callbacks (see CLAUDE.md)
    "RUF001",  # Em-dash / unicode typography is intentional house style
    "RUF002",  # Em-dash / unicode typography is intentional in docstrings
    "RUF003",  # Em-dash / unicode typography is intentional in comments
    "DTZ005",  # Naive local timestamps are intentional for run IDs / filenames / logs
    "DTZ001",  # Naive datetimes are intentional in this codebase
    "ARG004",  # Unused static-method args OK for uniform ML builder signatures
]

[tool.ruff.lint.per-file-ignores]
"conftest.py" = [
    "ARG001",  # Unused arguments OK in pytest hooks (required signatures)
    "N806",    # Uppercase variable names OK in ML test fixtures (X_train, etc.)
    "D",       # Docstrings not required in test infrastructure
]
"**/tests/**/*.py" = [
    "ARG",     # Unused arguments OK in tests
    "S",       # assert / tmp paths / pickle OK in tests
    "N806",    # Uppercase variable names OK in ML tests (X, X_train, etc.)
    "N817",    # CamelCase-as-acronym imports OK in tests (PredictionHistory as PH)
    "D",       # Docstrings not required in tests
    "PT011",   # Broad pytest.raises OK in tests
    "B017",    # Blind pytest.raises(Exception) OK in tests
    "SIM117",  # Nested with statements OK in tests
    "PTH",     # open()/os.chmod OK in test file I/O
    "E402",    # Imports after pytest.importorskip() guard are intentional
    "F401",    # Imports for SQLAlchemy model/table registration side effects
]
"tests/**/*.py" = [
    "ARG",     # Unused arguments OK in tests
    "S",       # assert / tmp paths / pickle OK in tests
    "N806",    # Uppercase variable names OK in ML tests (X, X_train, etc.)
    "N817",    # CamelCase-as-acronym imports OK in tests
    "D",       # Docstrings not required in tests
    "PT011",   # Broad pytest.raises OK in tests
    "B017",    # Blind pytest.raises(Exception) OK in tests
    "SIM117",  # Nested with statements OK in tests
    "PTH",     # open()/os.chmod OK in test file I/O
    "E402",    # Imports after pytest.importorskip() guard are intentional
    "F401",    # Imports for SQLAlchemy model/table registration side effects
]
"apps/api/tests/e2e/**/*.py" = [
    "ARG",     # Unused arguments OK in tests (route handler lambdas)
    "S",       # Assert / subprocess OK in tests
    "D",       # Docstrings not required in tests
    "B017",    # Blind pytest.raises(Exception) OK in tests
    "SIM117",  # Nested with statements OK in tests
    "PTH",     # open()/os.chmod OK in test file I/O
]
"**/scripts/**/*.py" = [
    "S",       # subprocess / CLI orchestration OK in scripts
    "D",       # Docstrings not required in operational scripts
]
"scripts/**/*.py" = [
    "S",       # subprocess / CLI orchestration OK in scripts
    "D",       # Docstrings not required in operational scripts
]
"examples_*.py" = [
    "S108",    # Demo /tmp paths are intentional in examples
    "D",       # Relaxed docstrings in example scripts
]
# ML compute packages use math/tensor naming conventions (X, y, X_train, K, ET).
"packages/training/**/*.py" = ["N803", "N806", "N812", "N817"]
"packages/models/**/*.py" = ["N803", "N806", "N812", "N817"]
"packages/data/**/*.py" = ["N803", "N806", "N812", "N817"]
"packages/training/img_classifier_training/optimizer.py" = [
    "S311",    # Non-crypto RNG is correct for hyperparameter sampling
]
"packages/data/img_classifier_data/image_loader.py" = [
    "S301",    # pickle is used only for a trusted, locally-generated feature cache
]
"apps/api/img_classifier_api/app.py" = [
    "S104",    # Binding 0.0.0.0 is intended for the containerized API
]
"apps/api/run_api.py" = [
    "S104",    # Binding 0.0.0.0 is intended for the containerized API
]
# Lightweight local-disk metadata ops; negligible blocking, not worth offloading.
"apps/api/img_classifier_api/routers/models.py" = ["ASYNC240"]
"apps/api/img_classifier_api/routers/training.py" = ["ASYNC240"]
"**/alembic/**/*.py" = [
    "D",       # Generated migration files
    "S",       # Generated migration files
    "F401",    # Models imported so Alembic autogenerate sees their metadata
]
"tests/test_models.py" = [
    "F401",    # Unused imports OK for conditional TensorFlow availability check
]
"__init__.py" = [
    "F401",    # Unused imports OK in __init__.py
    "D104",    # Package docstring optional
]

[tool.ruff.lint.pydocstyle]
convention = "google"  # Matches existing Args:/Returns:/Raises: docstrings

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"  # Enforce absolute imports (see CLAUDE.md)

[tool.ruff.lint.flake8-bugbear]
# FastAPI dependency-injection markers are evaluated once at import — idiomatic, not B008 bugs.
extend-immutable-calls = [
    "fastapi.Depends",
    "fastapi.Query",
    "fastapi.Path",
    "fastapi.Header",
    "fastapi.Cookie",
    "fastapi.Body",
    "fastapi.Form",
    "fastapi.File",
    "fastapi.Security",
]

[tool.ruff.lint.isort]
known-first-party = [
    "img_classifier_config",
    "img_classifier_utils",
    "img_classifier_data",
    "img_classifier_models",
    "img_classifier_training",
    "img_classifier_api",
]
force-single-line = false
lines-after-imports = 2

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

# ty Configuration (Astral's fast type checker, written in Rust)
[tool.ty.environment]
python = ".venv"
python-version = "3.11"
python-platform = "all"

[tool.ty.src]
include = [
    "packages/config/img_classifier_config",
    "packages/utils/img_classifier_utils",
    "packages/data/img_classifier_data",
    "packages/models/img_classifier_models",
    "packages/training/img_classifier_training",
    "apps/api/img_classifier_api",
    "packages/cli/img_classifier_cli",
]
exclude = [
    "**/__pycache__",
    "**/deprecated_*",
    "**/.venv",
    "**/node_modules",
]

[tool.ty.rules]
unresolved-import = "error"
# Disable for TensorFlow/Keras dynamic attributes
unresolved-attribute = "ignore"
possibly-missing-attribute = "ignore"
invalid-attribute-access = "ignore"

# Codespell Configuration (spell checking for code, comments, and docs)
[tool.codespell]
skip = "uv.lock,*.keras,*.svg,*.lock,*.min.js,*.pdf,*.png,*.jpg,*.csv,htmlcov,.git,.venv,.ruff_cache,.ty_cache,*.ipynb,research_papers,*/research_papers"
ignore-words-list = "nd,arange,te,hist,fpr,tpr,ba,fo,nin,som,anull"  # ML/array + nginx cipher terms
check-filenames = true

# Vulture Configuration (dead-code detection — informational, see `make deadcode`)
[tool.vulture]
min_confidence = 80
paths = ["packages", "apps", "vulture_allowlist.py"]
exclude = ["*/tests/*", "*/deprecated_*", "*/alembic/*"]
ignore_decorators = [
    "@app.*",
    "@router.*",
    "@pytest.fixture",
    "@field_validator",
    "@model_validator",
    "@property",
]
# Keras callback hooks and framework-driven names are invoked dynamically
ignore_names = ["on_epoch_end", "on_train_*", "on_batch_*", "logs", "exc_*"]
