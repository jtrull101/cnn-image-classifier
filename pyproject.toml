# Monorepo Workspace Configuration
[project]
name = "alz-mri-neural-network"
version = "0.1.0"
requires-python = ">=3.11,<3.14"
dependencies = [
    "img-classifier-config",
    "img-classifier-data",
    "img-classifier-models",
    "img-classifier-training",
    "img-classifier-utils",
    "img-classifier-cli",
]

[tool.uv.workspace]
members = [
    "apps/api",
    "packages/cli",
    "packages/config",
    "packages/data",
    "packages/models",
    "packages/training",
    "packages/utils",
]

[dependency-groups]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "pytest-ordering>=0.6",
    "pytest-xdist>=3.5.0",
    "pytest-timeout>=2.2.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.1.0",
    "pyright>=1.1.0",
]

[tool.uv.sources]
img-classifier-cli = { workspace = true }
img-classifier-config = { workspace = true }
img-classifier-data = { workspace = true }
img-classifier-models = { workspace = true }
img-classifier-training = { workspace = true }
img-classifier-utils = { workspace = true }

# Pytest Configuration
[tool.pytest.ini_options]
minversion = "7.0"
addopts = [
    "-n=auto",  # Run tests in parallel using all available CPU cores
    "--dist=loadgroup",  # Distribute tests by group (respects marks)
    "--strict-markers",  # Enforce marker registration
    "--tb=short",  # Shorter traceback format
    "-v",  # Verbose output
    "--maxfail=3",  # Stop after 3 failures
    "--cov-report=term-missing",
    "--cov-report=html",
    "--cov-report=xml",
    "--timeout=300",  # Global timeout of 5 minutes per test
    "-ra",  # Show extra test summary info
]
testpaths = ["tests", "packages"]
pythonpath = ["."]
python_files = ["test_*.py", "*_test.py", "tests.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

# Marker definitions (also registered in conftest.py)
markers = [
    "unit: Fast unit tests using mocks and no I/O (default)",
    "integration: Slower integration tests using real dependencies and I/O",
    "slow: Slow tests that take significant time to run",
    "serial: Tests that must run serially, not in parallel",
    "requires_gpu: Tests that require GPU access",
    "requires_data: Tests that require dataset download",
]

filterwarnings = [
    "ignore::DeprecationWarning",
]

log_cli = true
log_cli_level = "INFO"
log_file = "/tmp/img_classifier_cnn/logs/test.log"
log_file_date_format = "%Y-%m-%d %H:%M:%S"
log_file_format = "%(asctime)s - %(name)s %(levelname)s %(message)s"
log_file_level = "INFO"
log_format = "%(asctime)s %(levelname)s %(message)s"
log_level = "DEBUG"

# xdist specific settings
[tool.pytest_xdist]
# Workers will be restarted after each test group
worker_restart_on_failure = true

# Coverage Configuration
[tool.coverage.run]
source = [
    "packages/config/img_classifier_config",
    "packages/utils/img_classifier_utils",
    "packages/data/img_classifier_data",
    "packages/models/img_classifier_models",
    "packages/training/img_classifier_training",
    "apps/api/img_classifier_api",
]
branch = true
omit = [
    "*/tests/*",
    "*/__pycache__/*",
    "*/deprecated_*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if __name__ == .__main__.:",
    "raise AssertionError",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
    "@abstractmethod",
]
precision = 2
show_missing = true
skip_covered = false
sort = "Cover"

# Ruff Configuration (replaces flake8, isort, autopep8)
[tool.ruff]
target-version = "py313"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # pyflakes
    "I",      # isort
    "N",      # pep8-naming
    "UP",     # pyupgrade
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "DTZ",    # flake8-datetimez
    "SIM",    # flake8-simplify
    "ARG",    # flake8-unused-arguments
    "PTH",    # flake8-use-pathlib
    "RUF",    # Ruff-specific rules
]
ignore = [
    "E501",   # line too long (handled by formatter)
    "B008",   # do not perform function calls in argument defaults
    "ARG001", # unused function argument (common in ML callbacks)
    "ARG002", # unused method argument
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = [
    "ARG",     # Unused arguments OK in tests
    "S101",    # Assert use is OK in tests
    "N806",    # Uppercase variable names OK in ML tests (X, X_train, etc.)
]
"tests/test_models.py" = [
    "F401",    # Unused imports OK for conditional TensorFlow availability check
]
"__init__.py" = [
    "F401",    # Unused imports OK in __init__.py
]

[tool.ruff.lint.isort]
known-first-party = [
    "img_classifier_config",
    "img_classifier_utils",
    "img_classifier_data",
    "img_classifier_models",
    "img_classifier_training",
    "img_classifier_api",
]
force-single-line = false
lines-after-imports = 2

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

# Pyright Configuration (modern, faster alternative to mypy)
[tool.pyright]
include = [
    "packages/config/img_classifier_config",
    "packages/utils/img_classifier_utils",
    "packages/data/img_classifier_data",
    "packages/models/img_classifier_models",
    "packages/training/img_classifier_training",
    "apps/api/img_classifier_api",
]
exclude = [
    "**/__pycache__",
    "**/deprecated_*",
    "**/.venv",
    "**/node_modules",
]
pythonVersion = "3.13"
pythonPlatform = "All"
typeCheckingMode = "basic"

# Type checking settings
reportMissingImports = true
reportAttributeAccessIssue = false  # Disable for TensorFlow keras attributes
