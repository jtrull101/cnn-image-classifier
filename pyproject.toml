# Monorepo Workspace Configuration
[project]
name = "alz-mri-neural-network"
version = "0.1.0"
requires-python = ">=3.11,<3.14"
dependencies = [
    "alz-mri-config",
    "alz-mri-data",
    "alz-mri-models",
    "alz-mri-training",
    "alz-mri-utils",
]

[tool.uv.workspace]
members = [
    "apps/api",
    "packages/config",
    "packages/data",
    "packages/models",
    "packages/training",
    "packages/utils",
]

[dependency-groups]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "pytest-ordering>=0.6",
    "ruff>=0.1.0",
    "pyright>=1.1.0",
]

[tool.uv.sources]
alz-mri-config = { workspace = true }
alz-mri-data = { workspace = true }
alz-mri-models = { workspace = true }
alz-mri-training = { workspace = true }
alz-mri-utils = { workspace = true }

# Pytest Configuration
[tool.pytest.ini_options]
minversion = "7.0"
addopts = [
    "--cov-report=term-missing",
    "--cov-report=html",
    "--cov-report=xml",
    "--strict-markers",
    "--strict-config",
    "-ra",
]
testpaths = [
    "packages/config/tests",
    "packages/utils/tests",
    "packages/data/tests",
    "packages/models/tests",
    "packages/training/tests",
    "apps/api/tests",
]
pythonpath = ["."]
python_files = ["test_*.py", "tests.py"]
filterwarnings = [
    "ignore::DeprecationWarning",
]
log_cli = true
log_cli_level = "INFO"
log_file = "/tmp/alz_mri_cnn/logs/test.log"
log_file_date_format = "%Y-%m-%d %H:%M:%S"
log_file_format = "%(asctime)s - %(name)s %(levelname)s %(message)s"
log_file_level = "INFO"
log_format = "%(asctime)s %(levelname)s %(message)s"
log_level = "DEBUG"

# Coverage Configuration
[tool.coverage.run]
source = [
    "packages/config/alz_mri_config",
    "packages/utils/alz_mri_utils",
    "packages/data/alz_mri_data",
    "packages/models/alz_mri_models",
    "packages/training/alz_mri_training",
    "apps/api/alz_mri_api",
]
branch = true
omit = [
    "*/tests/*",
    "*/__pycache__/*",
    "*/deprecated_*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if __name__ == .__main__.:",
    "raise AssertionError",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
    "@abstractmethod",
]
precision = 2

# Ruff Configuration (replaces flake8, isort, autopep8)
[tool.ruff]
target-version = "py313"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # pyflakes
    "I",      # isort
    "N",      # pep8-naming
    "UP",     # pyupgrade
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "DTZ",    # flake8-datetimez
    "SIM",    # flake8-simplify
    "ARG",    # flake8-unused-arguments
    "PTH",    # flake8-use-pathlib
    "RUF",    # Ruff-specific rules
]
ignore = [
    "E501",   # line too long (handled by formatter)
    "B008",   # do not perform function calls in argument defaults
    "ARG001", # unused function argument (common in ML callbacks)
    "ARG002", # unused method argument
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = [
    "ARG",     # Unused arguments OK in tests
    "S101",    # Assert use is OK in tests
    "N806",    # Uppercase variable names OK in ML tests (X, X_train, etc.)
]
"tests/test_models.py" = [
    "F401",    # Unused imports OK for conditional TensorFlow availability check
]
"__init__.py" = [
    "F401",    # Unused imports OK in __init__.py
]

[tool.ruff.lint.isort]
known-first-party = [
    "alz_mri_config",
    "alz_mri_utils",
    "alz_mri_data",
    "alz_mri_models",
    "alz_mri_training",
    "alz_mri_api",
]
force-single-line = false
lines-after-imports = 2

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

# Pyright Configuration (modern, faster alternative to mypy)
[tool.pyright]
include = [
    "packages/config/alz_mri_config",
    "packages/utils/alz_mri_utils",
    "packages/data/alz_mri_data",
    "packages/models/alz_mri_models",
    "packages/training/alz_mri_training",
    "apps/api/alz_mri_api",
]
exclude = [
    "**/__pycache__",
    "**/deprecated_*",
    "**/.venv",
    "**/node_modules",
]
pythonVersion = "3.13"
pythonPlatform = "All"
typeCheckingMode = "basic"

# Type checking settings
reportMissingImports = true
reportAttributeAccessIssue = false  # Disable for TensorFlow keras attributes
